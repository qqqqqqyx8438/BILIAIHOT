name: Deploy AI Hotboard to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:00 Beijing time (01:00 UTC)
    - cron: "0 1 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Collect RSS data
        run: python aggregator.py

      - name: Build event dashboard data
        run: python build_dashboard.py

      - name: Build static Bilibili recommendations
        run: python build_bilibili_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rm -rf site
          mkdir -p site/data
          cp dashboard.html site/index.html
          cp dashboard.html site/dashboard.html
          cp data/dashboard.json site/data/dashboard.json
          cp data/bilibili.json site/data/bilibili.json
          cp README.md site/README.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
