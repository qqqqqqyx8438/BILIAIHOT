<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BAI HOT</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#e0e0e0;font-family:Arial,sans-serif}.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:20px 32px;border-bottom:1px solid #2a2a4a}.header h1{font-size:22px;color:#ffd700}.header .sub{font-size:12px;color:#888;margin-top:4px}.container{max-width:1200px;margin:0 auto;padding:20px 24px}.tabs{display:flex;margin-bottom:24px;border-bottom:2px solid #2a2a4a}.tab{padding:12px 28px;cursor:pointer;font-size:14px;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px}.tab.active{color:#ffd700;border-bottom-color:#ffd700}.topic-card{background:#141428;border:1px solid #2a2a4a;border-radius:10px;padding:20px;margin-bottom:16px}.topic-header{display:flex;align-items:center;gap:14px;margin-bottom:12px}.rank{font-size:30px;font-weight:900;color:#ffd700;min-width:44px}.rank.small{font-size:22px;color:#aaa}.topic-info{flex:1}.topic-title{font-size:18px;font-weight:700;color:#fff;line-height:1.4}.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.source-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#1a1a35;border:1px solid #333;border-radius:16px;font-size:11px;color:#ccc;text-decoration:none;transition:all .2s}.source-pill:hover{background:#2a2a55;border-color:#ffd700;color:#ffd700}.source-pill .dot{width:5px;height:5px;border-radius:50%;background:#ffd700}.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}.video-card{background:#0d0d20;border:1px solid #2a2a4a;border-radius:8px;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:all .2s}.video-card:hover{border-color:#fb7299;transform:translateY(-2px)}.video-cover{position:relative;width:100%;padding-top:56%;background:#1a1a35;overflow:hidden}.video-cover img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}.video-play{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.85);color:#fff;font-size:10px;padding:2px 5px;border-radius:3px}.video-info{padding:10px}.video-title{font-size:12px;line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#ddd}.video-meta{display:flex;justify-content:space-between;font-size:10px;color:#777}.bv{font-family:monospace;font-size:9px;color:#555}
