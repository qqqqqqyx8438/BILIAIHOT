<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 热点看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:24px 32px;border-bottom:1px solid #2a2a4a;position:sticky;top:0;z-index:100}
.header h1{font-size:24px;color:#ffd700;margin-bottom:4px}
.header .sub{font-size:13px;color:#888}
.container{max-width:1200px;margin:0 auto;padding:20px 24px}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid #2a2a4a}
.tab{padding:12px 32px;cursor:pointer;font-size:15px;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:#ffd700;border-bottom-color:#ffd700}
.tab:hover{color:#ccc}

/* Topic Card */
.topic-card{background:#141428;border:1px solid #2a2a4a;border-radius:12px;padding:24px;margin-bottom:20px;transition:all .2s}
.topic-card:hover{border-color:#ffd70044;box-shadow:0 0 20px #ffd70011}
.topic-header{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.rank{font-size:32px;font-weight:900;color:#ffd700;min-width:48px;text-align:center}
.rank.small{font-size:24px;color:#aaa}
.topic-info{flex:1}
.topic-keyword{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.topic-resonance{font-size:13px;color:#ffd700}
.topic-summary{font-size:14px;color:#aaa;line-height:1.6;margin-bottom:16px;padding:12px;background:#0d0d20;border-radius:8px;border-left:3px solid #ffd700}

/* Source pills */
.sources-title{font-size:12px;color:#666;text-transform:uppercase;margin-bottom:8px;letter-spacing:1px}
.sources{display:flex;flex-wrap:wrap;gap:8px}
.source-pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;background:#1a1a35;border:1px solid #333355;border-radius:20px;font-size:12px;color:#ccc;text-decoration:none;transition:all .2s}
.source-pill:hover{background:#2a2a55;border-color:#ffd700;color:#ffd700}
.source-pill .dot{width:6px;height:6px;border-radius:50%;background:#ffd700}

/* B站视频卡片 */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.video-card{background:#0d0d20;border:1px solid #2a2a4a;border-radius:10px;overflow:hidden;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;display:block}
.video-card:hover{border-color:#fb7299;transform:translateY(-2px)}
.video-cover{position:relative;width:100%;padding-top:56.25%;background:#1a1a35;overflow:hidden}
.video-cover img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.video-play{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.video-info{padding:12px}
.video-title{font-size:13px;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#ddd}
.video-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#777}
.video-author{display:flex;align-items:center;gap:4px}
.bv{font-family:monospace;font-size:10px;color:#666}

/* Loading */
.loading{text-align:center;padding:40px;color:#666}
.spinner{width:32px;height:32px;border:3px solid #333;border-top-color:#ffd700;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty */
.empty{text-align:center;padding:60px;color:#555}
.badge{display:inline-flex;align-items:center;gap:4px;background:#ffd70022;color:#ffd700;font-size:11px;padding:3px 8px;border-radius:10px;margin-left:8px}
.section-divider{display:flex;align-items:center;gap:12px;margin:20px 0 12px}
.section-divider .line{flex:1;height:1px;background:#2a2a4a}
.section-divider span{font-size:12px;color:#555;letter-spacing:1px}

/* stats bar */
.stats-bar{display:flex;gap:24px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#141428;border:1px solid #2a2a4a;border-radius:8px;padding:12px 20px}
.stat .val{font-size:24px;font-weight:700;color:#ffd700}
.stat .lbl{font-size:11px;color:#666;margin-top:2px}
</style>
</head>
<body>

<div class="header">
  <h1>AI 热点看板</h1>
  <div class="sub" id="updateTime">数据加载中...</div>
</div>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">🔥 热点榜 · 信源共鸣</div>
    <div class="tab" onclick="switchTab(1)">📺 B站精选 · 48h高播稿件</div>
  </div>

  <div id="tabContent"></div>
</div>

<script>
let dashboard = null;
let bilibiliCache = {};

async function loadDashboard() {
  try {
    const resp = await fetch("data/dashboard.json");
    dashboard = await resp.json();
    document.getElementById("updateTime").textContent =
      "数据更新：" + new Date(dashboard.generated_at).toLocaleString("zh-CN") +
      " | 48h热点：" + dashboard.total_recent_items + "条 | 聚类话题：" + dashboard.hot_topics.length;
    switchTab(0);
  } catch(e) {
    document.getElementById("tabContent").innerHTML =
      '<div class="empty"><h3>数据加载失败</h3><p>请先运行 python build_dashboard.py</p></div>';
  }
}

function switchTab(idx) {
  document.querySelectorAll(".tab").forEach((t,i) => t.classList.toggle("active", i===idx));
  if (idx === 0) renderHotTopics();
  else renderBilibili();
}

// ======== Tab 1: 热点榜 ========
function renderHotTopics() {
  if (!dashboard || !dashboard.hot_topics) {
    document.getElementById("tabContent").innerHTML = '<div class="empty">暂无热点数据</div>';
    return;
  }

  let html = '<div class="stats-bar">';
  html += '<div class="stat"><div class="val">' + dashboard.hot_topics.length + '</div><div class="lbl">热点话题</div></div>';
  html += '<div class="stat"><div class="val">' + dashboard.total_recent_items + '</div><div class="lbl">48h资讯条数</div></div>';
  html += '</div>';

  dashboard.hot_topics.forEach(topic => {
    html += '<div class="topic-card">';
    html += '<div class="topic-header">';
    html += '<div class="rank' + (topic.rank > 3 ? ' small' : '') + '">#' + topic.rank + '</div>';
    html += '<div class="topic-info">';
    html += '<div class="topic-keyword">' + topic.keyword;
    html += '<span class="badge">' + topic.resonance + ' 个信源共鸣</span>';
    html += '</div>';
    html += '<div class="topic-resonance">涉及 ' + topic.item_count + ' 条相关资讯</div>';
    html += '</div></div>';

    html += '<div class="topic-summary">' + topic.summary + '</div>';

    html += '<div class="sources-title">共鸣信源</div>';
    html += '<div class="sources">';
    topic.sources.forEach(s => {
      html += '<a href="' + s.url + '" target="_blank" class="source-pill" title="' + s.title + '">';
      html += '<span class="dot"></span>' + s.name.substring(0, 50);
      html += '</a>';
    });
    html += '</div>';
    html += '</div>';
  });

  document.getElementById("tabContent").innerHTML = html;
}

// ======== Tab 2: B站精选 ========
async function renderBilibili() {
  if (!dashboard || !dashboard.hot_topics) {
    document.getElementById("tabContent").innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }

  let html = '<div class="stats-bar">';
  html += '<div class="stat"><div class="val">' + dashboard.hot_topics.length + '</div><div class="lbl">话题回扫中</div></div>';
  html += '</div>';

  // Render topic sections with loading placeholders
  dashboard.hot_topics.forEach((topic, idx) => {
    html += '<div class="topic-card" id="bili-topic-' + idx + '">';
    html += '<div class="topic-header">';
    html += '<div class="rank' + (topic.rank > 3 ? ' small' : '') + '">#' + topic.rank + '</div>';
    html += '<div class="topic-info">';
    html += '<div class="topic-keyword">' + topic.keyword;
    html += '<span class="badge">' + topic.resonance + ' 信源共鸣</span>';
    html += '</div></div></div>';
    html += '<div class="section-divider"><div class="line"></div><span>48h B站高播 TOP10</span><div class="line"></div></div>';
    html += '<div class="loading" id="bili-loading-' + idx + '"><div class="spinner"></div><div>搜索中...</div></div>';
    html += '<div class="video-grid" id="bili-videos-' + idx + '"></div>';
    html += '</div>';
  });

  document.getElementById("tabContent").innerHTML = html;

  // Load B站 results for each topic
  dashboard.hot_topics.forEach((topic, idx) => {
    fetchBilibiliVideos(topic.search_query, idx);
  });
}

async function fetchBilibiliVideos(keyword, topicIdx) {
  const loadingEl = document.getElementById("bili-loading-" + topicIdx);
  const videosEl = document.getElementById("bili-videos-" + topicIdx);

  // Cache check
  if (bilibiliCache[keyword]) {
    renderVideos(videosEl, loadingEl, bilibiliCache[keyword]);
    return;
  }

  try {
    const url = "https://api.bilibili.com/x/web-interface/search/type?" +
      "search_type=video&order=pubdate&duration=2&page=1&keyword=" + encodeURIComponent(keyword);
    const resp = await fetch(url, {
      headers: { "Referer": "https://www.bilibili.com" }
    });
    const data = await resp.json();

    if (data.code === 0 && data.data && data.data.result) {
      // Filter: only last 48h, sort by play count, take top 10
      const cutoff = Date.now() - 48 * 60 * 60 * 1000;
      let videos = data.data.result
        .filter(v => v.pubdate * 1000 > cutoff)
        .sort((a, b) => b.play - a.play)
        .slice(0, 10);

      bilibiliCache[keyword] = videos;
      renderVideos(videosEl, loadingEl, videos);
    } else {
      if (loadingEl) loadingEl.innerHTML = '<div class="empty">未找到相关视频</div>';
    }
  } catch(e) {
    if (loadingEl) loadingEl.innerHTML = '<div class="empty">B站搜索失败：' + e.message + '</div>';
  }
}

function renderVideos(videosEl, loadingEl, videos) {
  if (loadingEl) loadingEl.style.display = "none";
  if (!videos || videos.length === 0) {
    videosEl.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:20px">暂无48h内高播视频</div>';
    return;
  }

  videosEl.innerHTML = videos.map(v => {
    let playStr = v.play > 10000 ? Math.floor(v.play/10000) + "万" : v.play;
    return '<a href="https://www.bilibili.com/video/' + v.bvid + '" target="_blank" class="video-card">'
      + '<div class="video-cover">'
      + '<img src="' + v.pic.replace("http:", "https:") + '" alt="" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22><rect fill=%22%231a1a35%22 width=%22320%22 height=%22180%22/><text fill=%22%23555%22 x=%22160%22 y=%2295%22 text-anchor=%22middle%22 font-size=%2214%22>无封面</text></svg>\'">'
      + '<div class="video-play">' + playStr + ' 播放</div>'
      + '</div>'
      + '<div class="video-info">'
      + '<div class="video-title">' + v.title + '</div>'
      + '<div class="video-meta">'
      + '<div class="video-author">' + v.author + '</div>'
      + '<div class="bv">' + v.bvid + '</div>'
      + '</div></div></a>';
  }).join("");
}

// Start
loadDashboard();
</script>
</body>
</html>
